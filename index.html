<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sama-Aralan daily routine board — English or Filipino, personalised by each family.">
<meta name="theme-color" content="#2FAFB6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Routine">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Sama-Aralan Routine Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap">
<style>
  html,body{background:#FBFCFE}
  @media (prefers-color-scheme:dark){html,body{background:#161B22}}
  :root{
    --ground:#FBFCFE; --surface:#FFFFFF; --surface-2:#F1F5FA;
    --ink:#3A4454; --ink-soft:#6B7789; --ink-faint:#9AA6B6; --line:#E6EDF5;
    --brand:#2FAFB6; --brand-ink:#1E8A90; --brand-soft:#DAF5F6;
    --sun:#FFD166; --sun-soft:#FFF6E0; --on-sun:#5B4300;
    --badge:#E8553F;
    --t1:#DFF6EC; --t1i:#1E8A6A;
    --t2:#DEEEFB; --t2i:#2E7FC4;
    --t3:#FFE8DC; --t3i:#C85F39;
    --t4:#EBE6FB; --t4i:#6F5BC7;
    --t5:#FFF3CE; --t5i:#9C7210;
    --shadow:0 2px 3px rgba(58,68,84,.04), 0 8px 24px rgba(58,68,84,.06);
    --r-lg:26px; --r-md:20px; --r-sm:12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#161B22; --surface:#1E242D; --surface-2:#262D38;
      --ink:#E8EDF4; --ink-soft:#A8B3C2; --ink-faint:#7A8695; --line:#313945;
      --brand:#5FD3D9; --brand-ink:#7FE0E5; --brand-soft:#1C3A3D;
      --sun:#FFD166; --sun-soft:#3A3117; --on-sun:#FFE9AE;
      --badge:#F0705A;
      --t1:#1D3A31; --t1i:#7FD9BA; --t2:#1C3145; --t2i:#8CC2EE;
      --t3:#3D2A21; --t3i:#F0A184; --t4:#2B2541; --t4i:#B4A5F0;
      --t5:#3A3119; --t5i:#E8C976;
      --shadow:0 2px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --ground:#161B22; --surface:#1E242D; --surface-2:#262D38;
    --ink:#E8EDF4; --ink-soft:#A8B3C2; --ink-faint:#7A8695; --line:#313945;
    --brand:#5FD3D9; --brand-ink:#7FE0E5; --brand-soft:#1C3A3D;
    --sun:#FFD166; --sun-soft:#3A3117; --on-sun:#FFE9AE;
    --badge:#F0705A;
    --t1:#1D3A31; --t1i:#7FD9BA; --t2:#1C3145; --t2i:#8CC2EE;
    --t3:#3D2A21; --t3i:#F0A184; --t4:#2B2541; --t4i:#B4A5F0;
    --t5:#3A3119; --t5i:#E8C976;
    --shadow:0 2px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"Poppins","Century Gothic","Avenir Next","Segoe UI",system-ui,sans-serif;
    font-size:15.5px; font-weight:400; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
  h1,h2,h3{font-family:"Quicksand","Century Gothic","Avenir Next",system-ui,sans-serif;
    font-weight:700;margin:0;line-height:1.2}
  .eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);
    font-weight:600;margin:0}
  .alt{color:var(--ink-faint);font-weight:300}

  .banner{background:var(--sun-soft);border:1.5px solid var(--sun);border-radius:var(--r-md);
    padding:12px 15px;font-size:13.5px;margin-bottom:14px;color:var(--ink)}

  /* ---- language switch ---- */
  .langsw{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:3px;gap:2px}
  .langsw button{font-family:"Quicksand",sans-serif;font-size:13px;font-weight:700;
    border:0;background:transparent;color:var(--ink-faint);border-radius:99px;
    padding:7px 16px;cursor:pointer}
  .langsw button[aria-pressed="true"]{background:var(--surface);color:var(--brand-ink);
    box-shadow:0 1px 3px rgba(58,68,84,.12)}
  .langrow{display:flex;justify-content:flex-end;margin-bottom:10px}

  /* ---- today ---- */
  .today{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);
    padding:20px 22px 17px;display:flex;flex-direction:column;gap:14px}
  .today-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .today-text{flex:1 1 210px;min-width:0}
  #kidLine{font-size:12px;color:var(--ink-soft);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  #dayName{font-size:clamp(34px,10vw,54px);color:var(--brand-ink);letter-spacing:-.015em;margin-top:2px}
  #dayAlt{font-size:14px;margin:0;font-weight:300}
  #fullDate{font-size:16px;color:var(--ink-soft);font-weight:400;margin:5px 0 0}
  #clock{font-family:"Quicksand",sans-serif;font-variant-numeric:tabular-nums;font-size:21px;
    font-weight:700;background:var(--brand-soft);color:var(--brand-ink);
    border-radius:var(--r-sm);padding:7px 14px;white-space:nowrap}
  .daystrip{display:flex;gap:5px;margin:0;padding:0}
  .daystrip li{flex:1;list-style:none;text-align:center;padding:7px 0 8px;border-radius:var(--r-sm);
    background:var(--surface-2);color:var(--ink-faint);font-weight:600;font-size:12px;
    font-family:"Quicksand",sans-serif;letter-spacing:.04em}
  .daystrip li.is-today{background:var(--sun);color:var(--on-sun)}
  .progress-row{display:flex;align-items:center;gap:12px}
  .bar{flex:1;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .bar span{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--brand),var(--sun));transition:width .4s ease}
  #progressText{font-family:"Quicksand",sans-serif;font-size:13px;color:var(--ink-soft);
    font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}

  /* ---- buttons ---- */
  .controls{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 12px}
  .btn{font-family:"Quicksand",sans-serif;font-size:13.5px;font-weight:700;color:var(--ink-soft);
    background:var(--surface);border:1.5px solid var(--line);border-radius:99px;
    padding:9px 16px;cursor:pointer}
  .btn:hover{color:var(--brand-ink);border-color:var(--brand)}
  .btn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-sm{font-size:12.5px;padding:7px 13px}
  .btn:focus-visible,.check:focus-visible,.vid:focus-visible,.langsw button:focus-visible,
  input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--t2i);outline-offset:2px}

  /* ---- steps ---- */
  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .step{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);
    display:grid;grid-template-columns:58px 44px 1fr auto;align-items:center;gap:12px;
    padding:13px 15px;border:2px solid transparent}
  .step.is-now{border-color:var(--sun);background:var(--sun-soft)}
  .step.is-done .title{text-decoration:line-through;color:var(--ink-faint)}
  .step.is-done .icon{opacity:.4}
  .time{font-family:"Quicksand",sans-serif;font-variant-numeric:tabular-nums;font-size:13px;
    font-weight:700;color:var(--ink-soft)}
  .step.is-now .time{color:var(--badge)}
  .icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
  .icon svg{width:23px;height:23px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tint1 .icon{background:var(--t1)} .tint1 .icon svg{stroke:var(--t1i)}
  .tint2 .icon{background:var(--t2)} .tint2 .icon svg{stroke:var(--t2i)}
  .tint3 .icon{background:var(--t3)} .tint3 .icon svg{stroke:var(--t3i)}
  .tint4 .icon{background:var(--t4)} .tint4 .icon svg{stroke:var(--t4i)}
  .tint5 .icon{background:var(--t5)} .tint5 .icon svg{stroke:var(--t5i)}
  .title{font-family:"Quicksand",sans-serif;font-weight:700;font-size:17.5px;line-height:1.25}
  .title .sub{display:block;font-family:"Poppins",sans-serif;font-size:12px;font-weight:300;
    color:var(--ink-faint);line-height:1.35;margin-top:1px}
  .now-tag{display:inline-block;margin-right:7px;font-family:"Poppins",sans-serif;font-size:9.5px;
    font-weight:600;letter-spacing:.09em;text-transform:uppercase;background:var(--badge);
    color:#fff;border-radius:99px;padding:3px 8px;vertical-align:2px}
  .note{grid-column:3/-1;font-size:12.5px;color:var(--ink-soft);font-weight:300;margin:-2px 0 0}
  .check{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--line);
    background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;
    transition:transform .15s ease}
  .check:active{transform:scale(.9)}
  .check svg{width:21px;height:21px;stroke:var(--ink-faint);fill:none;stroke-width:2.8;
    stroke-linecap:round;stroke-linejoin:round;opacity:0}
  .step.is-done .check{background:var(--brand);border-color:var(--brand)}
  .step.is-done .check svg{stroke:#fff;opacity:1}

  /* ---- edit mode ---- */
  .step.editing{grid-template-columns:1fr;gap:9px;border-color:var(--line)}
  .erow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .erow label{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
  input[type="time"],input[type="text"],select,textarea{
    font-family:"Poppins",sans-serif;font-size:14px;color:var(--ink);background:var(--ground);
    border:1.5px solid var(--line);border-radius:var(--r-sm);padding:9px 11px}
  .f-text{flex:1 1 180px;min-width:0}
  textarea{width:100%;resize:vertical;min-height:54px;font-size:13px;font-weight:300}
  .del{color:var(--badge);border-color:var(--badge)}
  .del:hover{color:var(--badge);border-color:var(--badge)}
  .addbar{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}

  /* ---- circle time ---- */
  .circle{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);
    padding:20px 22px;margin-top:24px}
  .circle h2{font-size:23px;color:var(--brand-ink)}
  .circle-head{margin-bottom:14px}
  .vids{list-style:none;margin:0;padding:0;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
  .vid{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:var(--surface-2);border:1.5px solid transparent;border-radius:var(--r-sm);
    padding:11px 12px;color:inherit;font-family:"Quicksand",sans-serif;font-size:14.5px;
    font-weight:700;text-decoration:none}
  .vid:hover{border-color:var(--brand);background:var(--brand-soft)}
  .vid .play{width:32px;height:32px;flex:none;border-radius:50%;background:var(--brand);
    display:grid;place-items:center}
  .vid .play svg{width:13px;height:13px;fill:#fff;stroke:none}
  .vid .vname{min-width:0;line-height:1.25}
  .vid .vlen{display:block;font-family:"Poppins",sans-serif;font-weight:300;font-size:11.5px;
    color:var(--ink-soft);margin-top:1px}
  .lang{display:inline-block;font-family:"Poppins",sans-serif;font-size:9px;font-weight:600;
    letter-spacing:.08em;border-radius:99px;padding:2px 6px;margin-left:6px;vertical-align:1.5px}
  .lang.en{background:var(--t2);color:var(--t2i)}
  .lang.tl{background:var(--t1);color:var(--t1i)}

  /* ---- setup code ---- */
  .save{margin-top:24px;background:var(--surface);border-radius:var(--r-lg);
    box-shadow:var(--shadow);padding:20px 22px}
  .save h2{font-size:20px}
  .save p{font-size:13px;color:var(--ink-soft);font-weight:300;margin:7px 0 12px}
  .foot{margin-top:26px;padding-top:16px;border-top:1.5px solid var(--line);
    font-size:12.5px;color:var(--ink-faint);font-weight:300;display:flex;flex-direction:column;gap:5px}

  @media (max-width:520px){
    .step{grid-template-columns:50px 36px 1fr auto;gap:10px;padding:12px}
    .icon{width:36px;height:36px;border-radius:11px}.icon svg{width:20px;height:20px}
    .title{font-size:16px}.time{font-size:12px}.check{width:36px;height:36px}
    .note{grid-column:1/-1}.vids{grid-template-columns:1fr}
    .today,.circle,.save{padding-inline:17px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <div class="langrow">
    <div class="langsw" id="langsw" role="group" aria-label="Language / Wika">
      <button type="button" data-lang="en"  aria-pressed="true">English</button>
      <button type="button" data-lang="fil" aria-pressed="false">Filipino</button>
    </div>
  </div>

  <div class="banner" id="noStore" hidden></div>

  <header class="today">
    <div class="today-top">
      <div class="today-text">
        <p class="eyebrow" id="kidLine">&nbsp;</p>
        <h1 id="dayName">&nbsp;</h1>
        <p class="alt" id="dayAlt">&nbsp;</p>
        <p id="fullDate">&nbsp;</p>
      </div>
      <div id="clock">&nbsp;</div>
    </div>
    <ul class="daystrip" id="daystrip"></ul>
    <div class="progress-row">
      <div class="bar"><span id="progressBar"></span></div>
      <div id="progressText">&nbsp;</div>
    </div>
  </header>

  <div class="controls">
    <button class="btn" id="editToggle" type="button" aria-pressed="false"></button>
    <button class="btn" id="notesToggle" type="button" aria-pressed="false"></button>
    <button class="btn" id="jumpNow" type="button"></button>
    <button class="btn" id="resetChecks" type="button"></button>
  </div>

  <ul class="steps" id="steps"></ul>
  <div class="addbar" id="addbar" hidden>
    <button class="btn btn-sm" id="addStep" type="button"></button>
    <button class="btn btn-sm" id="editName" type="button"></button>
    <button class="btn btn-sm del" id="resetAll" type="button"></button>
  </div>

  <section class="circle">
    <div class="circle-head">
      <h2 id="circleTitle">Circle Time</h2>
      <p class="eyebrow" id="circleSub">&nbsp;</p>
    </div>
    <ul class="vids" id="vids"></ul>
  </section>

  <section class="save">
    <h2 id="saveTitle">Setup Code</h2>
    <p id="saveBody">&nbsp;</p>
    <textarea id="codeBox" rows="3" readonly aria-label="Setup code"></textarea>
    <div class="addbar">
      <button class="btn btn-sm" id="copyCode" type="button"></button>
      <button class="btn btn-sm" id="pasteCode" type="button"></button>
    </div>
  </section>

  <footer class="foot">
    <div id="foot1">&nbsp;</div>
    <div id="foot2">&nbsp;</div>
  </footer>
</div>

  };
  var ICON_NAMES = {

        pencil:"Pencil",blocks:"Toys",plate:"Meal",moon:"Sleep",tree:"Outdoors",book:"Book",
        bath:"Bath",bed:"Bed",hands:"Hands",wash:"Water",heart:"Heart"},
    fil:{sun:"Araw",shirt:"Damit",bowl:"Mangkok",tooth:"Ngipin",music:"Musika",apple:"Prutas",

        bath:"Paliligo",bed:"Higaan",hands:"Kamay",wash:"Tubig",heart:"Puso"}
  };

  /* ---------- interface strings ---------- */
  var UI = {
    en:{
      edit:"Edit routine", editDone:"Done editing", notes:"Grown-up notes",
      now:"What's now?", clear:"Clear checks", add:"+ Add activity",
      kidName:"Child's name", reset:"Reset to default",
      kidLine:function(n){return n+"'s day"}, noName:"Today's routine",
      doneCount:"done", nowTag:"Now",
      circleSub:"Songs in order · tap to open in Drive",
      saveTitle:"Setup Code",
      saveBody:"This routine is saved on this phone only. If you change phones or clear your browser data, copy the code below and keep it in your Notes.",

  /* ------------------------------------------------------------------ */

  var DAYS = {
    en:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
    fil:["Linggo","Lunes","Martes","Miyerkules","Huwebes","Biyernes","Sabado"]
  };
  var SHORT = { en:["Su","Mo","Tu","We","Th","Fr","Sa"], fil:["Li","Lu","Ma","Mi","Hu","Bi","Sa"] };
  var MONTHS = {
    en:["January","February","March","April","May","June","July",
        "August","September","October","November","December"],
    fil:["Enero","Pebrero","Marso","Abril","Mayo","Hunyo","Hulyo",
         "Agosto","Setyembre","Oktubre","Nobyembre","Disyembre"]
  };
  var STORE = "samaAralanRoutine.v3";

  function mins(hhmm){var p=String(hhmm).split(":");return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0)}
  function pretty(hhmm){
    var m=mins(hhmm), h=Math.floor(m/60), mm=m%60, ap=h<12?"AM":"PM", h12=h%12; if(h12===0)h12=12;
    return h12+":"+(mm<10?"0"+mm:mm)+" "+ap;
  }
  function stamp(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
  function uid(){return "u"+Math.random().toString(36).slice(2,8)}

  /* ---------- state ---------- */
  var storeOK = true;
  var state = {lang:"en", child:"", routine:defaultRoutine(), day:"", done:[]};

  function L(){ return UI[state.lang] || UI.en; }
  /* primary / secondary text for one step, per chosen language */
  function pri(s){ return state.lang==="en" ? (s.en||s.fil||"") : (s.fil||s.en||"") }
  function sec(s){ return state.lang==="en" ? (s.fil||"")       : (s.en||"") }
  function noteOf(s){ return state.lang==="en" ? (s.nEn||s.nFil||"") : (s.nFil||s.nEn||"") }

  /* accept routines saved by older versions (tl / note) */
  function normalise(list){
    for(var i=0;i<list.length;i++){
      var s = list[i];
      if(s.fil === undefined && s.tl !== undefined) s.fil = s.tl;
      if(s.nFil === undefined && s.note !== undefined) s.nFil = s.note;
      if(s.en  === undefined) s.en = "";
      if(s.fil === undefined) s.fil = "";
    }
    return list;
  }

  function load(){
    try{
      window.localStorage.setItem("__t","1"); window.localStorage.removeItem("__t");
    }catch(e){ storeOK = false; }
    if(storeOK){
      try{
        var raw = window.localStorage.getItem(STORE);
        if(raw){
          var p = JSON.parse(raw);
          if(p && Object.prototype.toString.call(p.routine)==="[object Array]" && p.routine.length){
            state.routine = normalise(p.routine);
            state.child   = typeof p.child==="string" ? p.child : "";
            state.day     = typeof p.day==="string" ? p.day : "";
            state.done    = Object.prototype.toString.call(p.done)==="[object Array]" ? p.done : [];
          }
          if(p && (p.lang==="en"||p.lang==="fil")) state.lang = p.lang;
        }
      }catch(e){}
    }
    var today = stamp(new Date());
    if(state.day !== today){ state.day = today; state.done = []; }
  }
  function save(){
    try{ window.localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
    refreshCode();
  }
  function sortRoutine(){ state.routine.sort(function(a,b){return mins(a.t)-mins(b.t)}); }

  /* ---------- setup code ---------- */
  var codeBox = document.getElementById("codeBox");
  function refreshCode(){
    try{
      var payload = JSON.stringify({lang:state.lang, child:state.child, routine:state.routine});
      codeBox.value = window.btoa(unescape(encodeURIComponent(payload)));
    }catch(e){ codeBox.value = "—"; }
  }
  document.getElementById("copyCode").addEventListener("click", function(){
    var b = this;
    codeBox.focus(); codeBox.select();
    var ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){}
    if(!ok && navigator.clipboard){ navigator.clipboard.writeText(codeBox.value); ok = true; }
    b.textContent = ok ? L().copied : L().selectCopy;
    setTimeout(function(){ b.textContent = L().copy; }, 2200);
  });
  document.getElementById("pasteCode").addEventListener("click", function(){
    var raw = window.prompt(L().pastePrompt);
    if(!raw) return;
    try{
      var p = JSON.parse(decodeURIComponent(escape(window.atob(raw.replace(/\s+/g,"")))));
      if(!p || Object.prototype.toString.call(p.routine)!=="[object Array]" || !p.routine.length) throw 0;
      state.routine = normalise(p.routine);
      state.child   = typeof p.child==="string" ? p.child : "";
      if(p.lang==="en"||p.lang==="fil") state.lang = p.lang;
      state.done    = [];
      sortRoutine(); save(); applyLang();
    }catch(e){ window.alert(L().pasteBad); }
  });

  /* ---------- render ---------- */
  var stepsEl = document.getElementById("steps");
  var editing = false, showNotes = false;

  function iconSelect(cur){
    var names = ICON_NAMES[state.lang] || ICON_NAMES.en;
    var out = '<select class="f-icon" aria-label="Icon">';
    for(var k in ICONS){ if(Object.prototype.hasOwnProperty.call(ICONS,k)){
      out += '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+esc(names[k]||k)+'</option>';
    }}
    return out+'</select>';
  }

  function render(){
    var t = L();
    stepsEl.innerHTML = "";
    for(var i=0;i<state.routine.length;i++){
      var s = state.routine[i];
      var li = document.createElement("li");
      li.setAttribute("data-id", s.id);
      if(editing){
        var priV = state.lang==="en" ? (s.en||"") : (s.fil||"");
        var secV = state.lang==="en" ? (s.fil||"") : (s.en||"");
        var nPri = state.lang==="en" ? (s.nEn||"") : (s.nFil||"");
        li.className = "step editing";
        li.innerHTML =
          '<div class="erow">'+
            '<label>'+esc(t.lblTime)+'</label><input type="time" class="f-time" value="'+esc(s.t)+'">'+
            iconSelect(s.icon)+
            '<button class="btn btn-sm del f-del" type="button">'+esc(t.remove)+'</button>'+
          '</div>'+
          '<div class="erow">'+
            '<input type="text" class="f-pri f-text" value="'+esc(priV)+'" placeholder="'+esc(t.phTitle)+'">'+
            '<input type="text" class="f-sec f-text" value="'+esc(secV)+'" placeholder="'+esc(t.phAlt)+'">'+
          '</div>'+
          '<textarea class="f-note" placeholder="'+esc(t.phNote)+'">'+esc(nPri)+'</textarea>';
      }else{
        var second = sec(s), n = noteOf(s);
        li.className = "step tint"+((i%5)+1) + (state.done.indexOf(s.id)!==-1 ? " is-done" : "");
        li.innerHTML =
          '<span class="time">'+pretty(s.t)+'</span>'+
          '<span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[s.icon]||ICONS.sun)+'</svg></span>'+
          '<h2 class="title">'+esc(pri(s))+(second?'<span class="sub">'+esc(second)+'</span>':'')+'</h2>'+
          '<button class="check" type="button" aria-label="'+esc(t.doneCount)+'" aria-pressed="'+
            (state.done.indexOf(s.id)!==-1?"true":"false")+'">'+
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.8 9.6 17.4 19 7"/></svg>'+
          '</button>'+
          (n ? '<p class="note"'+(showNotes?"":" hidden")+'>'+esc(n)+'</p>' : '');
      }
      stepsEl.appendChild(li);
    }
    paint();
  }

  function renderVideos(){
    var out = "";
    for(var i=0;i<VIDEOS.length;i++){
      var v = VIDEOS[i];
      var desc = state.lang==="en" ? v.dEn : v.dFil;
      var play = '<span class="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5Z"/></svg></span>';
      var chip = v.lang ? '<span class="lang '+(v.lang==="EN"?"en":"tl")+'">'+v.lang+'</span>' : '';
      var label = '<span class="vname">'+esc(v.name)+chip+'<span class="vlen">'+esc(desc)+'</span></span>';
      out += '<li><a class="vid" href="'+D+esc(v.id)+'/view" target="_blank" rel="noopener">'+play+label+'</a></li>';
    }
    document.getElementById("vids").innerHTML = out;
  }

  /* ---------- progress ---------- */
  var barEl = document.getElementById("progressBar");
  var txtEl = document.getElementById("progressText");
  function paint(){
    var n = 0;
    for(var i=0;i<state.routine.length;i++){ if(state.done.indexOf(state.routine[i].id)!==-1) n++; }
    barEl.style.width = (state.routine.length ? n/state.routine.length*100 : 0) + "%";
    txtEl.textContent = n + " / " + state.routine.length + " " + L().doneCount;
  }

  /* ---------- date + now ---------- */
  var dayNameEl=document.getElementById("dayName"), dayAltEl=document.getElementById("dayAlt"),
      fullDateEl=document.getElementById("fullDate"), clockEl=document.getElementById("clock"),
      stripEl=document.getElementById("daystrip"), kidEl=document.getElementById("kidLine");
  var lastKey = "";

  function tick(force){
    var now = new Date(), key = stamp(now)+"|"+state.lang;
    if(force || key !== lastKey){
      lastKey = key;
      var other = state.lang==="en" ? "fil" : "en";
      dayNameEl.textContent  = DAYS[state.lang][now.getDay()];
      dayAltEl.textContent   = DAYS[other][now.getDay()];
      fullDateEl.textContent = MONTHS[state.lang][now.getMonth()]+" "+now.getDate()+", "+now.getFullYear();
      kidEl.textContent      = state.child ? L().kidLine(state.child) : L().noName;
      var html = "";
      for(var d=0;d<7;d++){ html += '<li class="'+(d===now.getDay()?"is-today":"")+'">'+SHORT[state.lang][d]+'</li>'; }
      stripEl.innerHTML = html;
      var today = stamp(now);
      if(state.day !== today){ state.day = today; state.done = []; save(); render(); }
    }

    var h=now.getHours(), mm=now.getMinutes(), ap=h<12?"AM":"PM", h12=h%12; if(h12===0)h12=12;
    clockEl.textContent = h12+":"+(mm<10?"0"+mm:mm)+" "+ap;

    if(editing) return;
    var nowMins = h*60+mm, cur = -1;
    for(var k=0;k<state.routine.length;k++){ if(mins(state.routine[k].t) <= nowMins) cur = k; }
    var rows = stepsEl.children;
    for(var j=0;j<rows.length;j++){
      var on = (j === cur);
      if(rows[j].classList.contains("is-now") !== on){
        rows[j].classList.toggle("is-now", on);
        var ti = rows[j].querySelector(".title"), tag = ti ? ti.querySelector(".now-tag") : null;
        if(on && ti && !tag) ti.insertAdjacentHTML("afterbegin", '<span class="now-tag">'+esc(L().nowTag)+'</span>');
        else if(!on && tag) tag.remove();
      }
    }
  }

  /* ---------- language ---------- */
  function applyLang(){
    var t = L();
    document.documentElement.lang = state.lang === "en" ? "en" : "fil";

    var sw = document.getElementById("langsw").children;
    for(var i=0;i<sw.length;i++){
      sw[i].setAttribute("aria-pressed", sw[i].getAttribute("data-lang")===state.lang ? "true":"false");
    }
    document.getElementById("editToggle").textContent  = editing ? t.editDone : t.edit;
    document.getElementById("notesToggle").textContent = t.notes;
    document.getElementById("jumpNow").textContent     = t.now;
    document.getElementById("resetChecks").textContent = t.clear;
    document.getElementById("addStep").textContent     = t.add;
    document.getElementById("editName").textContent    = t.kidName;
    document.getElementById("resetAll").textContent    = t.reset;
    document.getElementById("circleSub").textContent   = t.circleSub;
    document.getElementById("saveTitle").textContent   = t.saveTitle;
    document.getElementById("saveBody").textContent    = t.saveBody;
    document.getElementById("copyCode").textContent    = t.copy;
    document.getElementById("pasteCode").textContent   = t.paste;
    document.getElementById("foot1").textContent       = t.foot1;
    document.getElementById("foot2").textContent       = t.foot2;
    var ns = document.getElementById("noStore");
    ns.innerHTML = t.noStore;
    ns.hidden = storeOK;

    renderVideos();
    render();
    tick(true);
  }

  document.getElementById("langsw").addEventListener("click", function(ev){
    var b = ev.target.closest ? ev.target.closest("button[data-lang]") : null;
    if(!b) return;
    var next = b.getAttribute("data-lang");
    if(next === state.lang) return;
    if(editing) harvest();          /* keep in-progress edits before swapping */
    state.lang = next;
    save(); applyLang();
  });

  /* ---------- interactions ---------- */
  stepsEl.addEventListener("click", function(ev){
    var t = ev.target;
    var chk = t.closest ? t.closest(".check") : null;
    if(chk){
      var id = chk.parentNode.getAttribute("data-id");
      var at = state.done.indexOf(id);
      if(at === -1) state.done.push(id); else state.done.splice(at,1);
      chk.parentNode.classList.toggle("is-done", at === -1);
      chk.setAttribute("aria-pressed", at === -1 ? "true" : "false");
      save(); paint(); return;
    }
    var del = t.closest ? t.closest(".f-del") : null;
    if(del){
      var row = del.closest("li"), rid = row.getAttribute("data-id");
      harvest();
      for(var i=0;i<state.routine.length;i++){
        if(state.routine[i].id === rid){ state.routine.splice(i,1); break; }
      }
      save(); render();
    }
  });

  /* pull edit fields back into state, respecting which language is primary */
  function harvest(){
    var rows = stepsEl.children;
    for(var i=0;i<rows.length;i++){
      var id = rows[i].getAttribute("data-id");
      var tI = rows[i].querySelector(".f-time"); if(!tI) continue;
      for(var j=0;j<state.routine.length;j++){
        if(state.routine[j].id !== id) continue;
        var s = state.routine[j];
        s.t    = tI.value || s.t;
        s.icon = rows[i].querySelector(".f-icon").value;
        var priV = rows[i].querySelector(".f-pri").value;
        var secV = rows[i].querySelector(".f-sec").value;
        var nV   = rows[i].querySelector(".f-note").value;
        if(state.lang === "en"){ s.en = priV || L().newAct; s.fil = secV; s.nEn = nV; }
        else                   { s.fil = priV || L().newAct; s.en  = secV; s.nFil = nV; }
        break;
      }
    }
    sortRoutine();
  }

  var editBtn = document.getElementById("editToggle");
  editBtn.addEventListener("click", function(){
    if(editing){ harvest(); save(); }
    editing = !editing;
    editBtn.setAttribute("aria-pressed", editing ? "true" : "false");
    editBtn.textContent = editing ? L().editDone : L().edit;
    document.getElementById("addbar").hidden = !editing;
    render(); tick(true);
  });

  var notesBtn = document.getElementById("notesToggle");
  notesBtn.addEventListener("click", function(){
    showNotes = !showNotes;
    notesBtn.setAttribute("aria-pressed", showNotes ? "true" : "false");
    var notes = stepsEl.querySelectorAll(".note");
    for(var i=0;i<notes.length;i++) notes[i].hidden = !showNotes;
  });

  document.getElementById("jumpNow").addEventListener("click", function(){
    var el = stepsEl.querySelector(".is-now") || stepsEl.firstChild;
    if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
  });

  document.getElementById("resetChecks").addEventListener("click", function(){
    state.done = []; save(); render();
  });

  document.getElementById("addStep").addEventListener("click", function(){
    harvest();
    state.routine.push({id:uid(), t:"12:00", icon:"heart",
      en:L().newAct, fil:UI.fil.newAct, nEn:"", nFil:""});
    if(state.lang==="fil"){ var last=state.routine[state.routine.length-1]; last.fil=UI.fil.newAct; last.en=UI.en.newAct; }
    sortRoutine(); save(); render();
  });

  document.getElementById("editName").addEventListener("click", function(){
    var n = window.prompt(L().namePrompt, state.child || "");
    if(n === null) return;
    state.child = n.trim().slice(0,28); save(); tick(true);
  });

  document.getElementById("resetAll").addEventListener("click", function(){
    if(!window.confirm(L().resetAsk)) return;
    state.routine = defaultRoutine(); state.done = []; save(); render(); tick(true);
  });

  /* ---------- go ---------- */
  load();
  sortRoutine();
  applyLang();
  refreshCode();
  setInterval(tick, 20000);
})();
</script>

</body>
</html>
