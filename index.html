<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sama-Aralan daily routine board — English or Filipino, personalised by each family.">
<meta name="theme-color" content="#2FAFB6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Routine">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Sama-Aralan Routine Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap">
<style>
  html,body{background:#FBFCFE}
  @media (prefers-color-scheme:dark){html,body{background:#161B22}}
  :root{
    --ground:#FBFCFE; --surface:#FFFFFF; --surface-2:#F1F5FA;
    --ink:#3A4454; --ink-soft:#6B7789; --ink-faint:#9AA6B6; --line:#E6EDF5;
    --brand:#2FAFB6; --brand-ink:#1E8A90; --brand-soft:#DAF5F6;
    --sun:#E8553F; --sun-soft:#FFF6E0; --on-sun:#5B4300;
    --badge:#E8553F;
    --plum:#6F5BC7; --plum-soft:#EBE6FB;
    --warn:#B86E00; --warn-soft:#FFF4E0; --warn-line:#F0C069;
    --t1:#DFF6EC; --t1i:#1E8A6A;
    --t2:#DEEEFB; --t2i:#2E7FC4;
    --t3:#FFE8DC; --t3i:#C85F39;
    --t4:#EBE6FB; --t4i:#6F5BC7;
    --t5:#FFF3CE; --t5i:#9C7210;
    --shadow:0 2px 3px rgba(58,68,84,.04), 0 8px 24px rgba(58,68,84,.06);
    --r-lg:26px; --r-md:20px; --r-sm:12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#161B22; --surface:#1E242D; --surface-2:#262D38;
      --ink:#E8EDF4; --ink-soft:#A8B3C2; --ink-faint:#7A8695; --line:#313945;
      --brand:#5FD3D9; --brand-ink:#7FE0E5; --brand-soft:#1C3A3D;
      --sun:#E8553F; --sun-soft:#3A3117; --on-sun:#FFE9AE;
      --badge:#F0705A; --plum:#B4A5F0; --plum-soft:#2B2541;
      --warn:#F2C078; --warn-soft:#332A18; --warn-line:#7A5E2A;
      --t1:#1D3A31; --t1i:#7FD9BA; --t2:#1C3145; --t2i:#8CC2EE;
      --t3:#3D2A21; --t3i:#F0A184; --t4:#2B2541; --t4i:#B4A5F0;
      --t5:#3A3119; --t5i:#E8C976;
      --shadow:0 2px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --ground:#161B22; --surface:#1E242D; --surface-2:#262D38;
    --ink:#E8EDF4; --ink-soft:#A8B3C2; --ink-faint:#7A8695; --line:#313945;
    --brand:#5FD3D9; --brand-ink:#7FE0E5; --brand-soft:#1C3A3D;
    --sun:#E8553F; --sun-soft:#3A3117; --on-sun:#FFE9AE;
    --badge:#F0705A; --plum:#B4A5F0; --plum-soft:#2B2541;
    --warn:#F2C078; --warn-soft:#332A18; --warn-line:#7A5E2A;
    --t1:#1D3A31; --t1i:#7FD9BA; --t2:#1C3145; --t2i:#8CC2EE;
    --t3:#3D2A21; --t3i:#F0A184; --t4:#2B2541; --t4i:#B4A5F0;
    --t5:#3A3119; --t5i:#E8C976;
    --shadow:0 2px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"Poppins","Century Gothic","Avenir Next","Segoe UI",system-ui,sans-serif;
    font-size:15.5px; font-weight:400; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
  h1,h2,h3{font-family:"Quicksand","Century Gothic","Avenir Next",system-ui,sans-serif;
    font-weight:700;margin:0;line-height:1.2}
  .eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);
    font-weight:600;margin:0}
  .alt{color:var(--ink-faint);font-weight:300}

  .banner{background:var(--sun-soft);border:1.5px solid var(--sun);border-radius:var(--r-md);
    padding:12px 15px;font-size:13.5px;margin-bottom:14px;color:var(--ink)}

  /* ---- language switch ---- */
  .langsw{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:3px;gap:2px}
  .langsw button{font-family:"Quicksand",sans-serif;font-size:13px;font-weight:700;
    border:0;background:transparent;color:var(--ink-faint);border-radius:99px;
    padding:7px 16px;cursor:pointer}
  .langsw button[aria-pressed="true"]{background:var(--surface);color:var(--brand-ink);
    box-shadow:0 1px 3px rgba(58,68,84,.12)}
  .langrow{display:flex;justify-content:flex-end;margin-bottom:10px}

  /* ---- name setup ---- */
  .namecard{background:var(--brand-soft);border-radius:var(--r-md);padding:15px 17px;
    margin-bottom:12px;display:flex;flex-direction:column;gap:9px}
  .namecard h2{font-size:17px;color:var(--brand-ink)}
  .namecard p{margin:0;font-size:13px;color:var(--ink-soft);font-weight:300}
  .namerow{display:flex;gap:8px;flex-wrap:wrap}
  .namerow input{flex:1 1 180px;min-width:0;background:var(--surface)}
  .namebtn{font-family:"Quicksand",sans-serif;font-size:13.5px;font-weight:700;
    background:var(--brand);color:#fff;border:0;border-radius:99px;padding:9px 20px;cursor:pointer}
  .changename{font-family:"Poppins",sans-serif;font-size:10.5px;font-weight:600;
    letter-spacing:.06em;text-transform:uppercase;background:none;border:0;
    color:var(--brand-ink);cursor:pointer;padding:0 0 0 8px;text-decoration:underline}

  /* ---- today ---- */
  .today{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);
    padding:20px 22px 17px;display:flex;flex-direction:column;gap:14px}
  .today-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .today-text{flex:1 1 210px;min-width:0}
  #kidLine{font-size:12px;color:var(--ink-soft);font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;display:flex;align-items:baseline;flex-wrap:wrap}
  #dayName{font-size:clamp(32px,9.5vw,52px);color:var(--brand-ink);letter-spacing:-.015em;margin-top:2px}
  #dayAlt{font-size:14px;margin:0;font-weight:300}
  #fullDate{font-size:16px;color:var(--ink-soft);font-weight:400;margin:5px 0 0}
  #clock{font-family:"Quicksand",sans-serif;font-variant-numeric:tabular-nums;font-size:21px;
    font-weight:700;background:var(--brand-soft);color:var(--brand-ink);
    border-radius:var(--r-sm);padding:7px 14px;white-space:nowrap}

  /* ---- week strip ---- */
  .weekrow{display:flex;align-items:center;gap:6px}
  .navbtn{flex:none;width:32px;height:38px;border-radius:var(--r-sm);border:1.5px solid var(--line);
    background:var(--surface);color:var(--ink-soft);cursor:pointer;display:grid;place-items:center;
    font-size:15px;font-weight:700;line-height:1;padding:0}
  .navbtn:hover:not(:disabled){border-color:var(--brand);color:var(--brand-ink)}
  .navbtn:disabled{opacity:.3;cursor:default}
  .daystrip{display:flex;gap:5px;margin:0;padding:0;flex:1;min-width:0}
  .daystrip li{flex:1;list-style:none;min-width:0}
  .daystrip button{width:100%;border:2px solid transparent;background:var(--surface-2);
    color:var(--ink-faint);border-radius:var(--r-sm);padding:5px 0 6px;cursor:pointer;
    font-family:"Quicksand",sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.03em;
    display:block;line-height:1.25}
  .daystrip button .dnum{display:block;font-size:13px;font-variant-numeric:tabular-nums}
  .daystrip button:hover:not(:disabled){color:var(--ink-soft)}
  .daystrip button:disabled{opacity:.35;cursor:default}
  .daystrip .is-today button{background:var(--sun);color:var(--on-sun);opacity:1}
  .daystrip .is-view button{border-color:var(--brand);color:var(--brand-ink)}
  .daystrip .is-today.is-view button{color:var(--on-sun)}
  .daystrip .has-plan button{position:relative}
  .daystrip .has-plan button::after{content:"";position:absolute;left:50%;bottom:3px;
    transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--plum)}

  .progress-row{display:flex;align-items:center;gap:12px}
  .bar{flex:1;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .bar span{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--brand),var(--sun));transition:width .4s ease}
  #progressText{font-family:"Quicksand",sans-serif;font-size:13px;color:var(--ink-soft);
    font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}

  /* ---- planner ---- */
  .planner{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);
    padding:15px 17px;margin-top:12px;display:flex;flex-direction:column;gap:11px}
  .planhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .chip{font-family:"Poppins",sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.07em;
    text-transform:uppercase;border-radius:99px;padding:4px 10px}
  .chip.everyday{background:var(--surface-2);color:var(--ink-soft)}
  .chip.special{background:var(--plum-soft);color:var(--plum)}
  .planrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .planned{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  .planned button{font-family:"Quicksand",sans-serif;font-size:12.5px;font-weight:700;
    background:var(--plum-soft);color:var(--plum);border:1.5px solid transparent;
    border-radius:99px;padding:6px 12px;cursor:pointer}
  .planned button:hover{border-color:var(--plum)}
  .planempty,.planhint{font-size:12.5px;color:var(--ink-faint);font-weight:300;margin:0}

  /* ---- buttons ---- */
  .controls{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 12px}
  .btn{font-family:"Quicksand",sans-serif;font-size:13.5px;font-weight:700;color:var(--ink-soft);
    background:var(--surface);border:1.5px solid var(--line);border-radius:99px;
    padding:9px 16px;cursor:pointer}
  .btn:hover{color:var(--brand-ink);border-color:var(--brand)}
  .btn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-sm{font-size:12.5px;padding:7px 13px}
  .btn-plum{color:var(--plum);border-color:var(--plum)}
  .btn:focus-visible,.check:focus-visible,.vid:focus-visible,.langsw button:focus-visible,
  .daystrip button:focus-visible,.navbtn:focus-visible,.planned button:focus-visible,
  .namebtn:focus-visible,.changename:focus-visible,
  input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--t2i);outline-offset:2px}

  /* ---- steps ---- */
  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .step{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);
    display:grid;grid-template-columns:58px 44px 1fr auto;align-items:center;gap:12px;
    padding:13px 15px;border:2px solid transparent}
  .step.no-check{grid-template-columns:58px 44px 1fr}
  .step.is-now{border-color:var(--sun);background:var(--sun-soft)}
  .step.is-done .title{text-decoration:line-through;color:var(--ink-faint)}
  .step.is-done .icon{opacity:.4}
  .time{font-family:"Quicksand",sans-serif;font-variant-numeric:tabular-nums;font-size:13px;
    font-weight:700;color:var(--ink-soft)}
  .step.is-now .time{color:var(--badge)}
  .icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
  .icon svg{width:23px;height:23px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tint1 .icon{background:var(--t1)} .tint1 .icon svg{stroke:var(--t1i)}
  .tint2 .icon{background:var(--t2)} .tint2 .icon svg{stroke:var(--t2i)}
  .tint3 .icon{background:var(--t3)} .tint3 .icon svg{stroke:var(--t3i)}
  .tint4 .icon{background:var(--t4)} .tint4 .icon svg{stroke:var(--t4i)}
  .tint5 .icon{background:var(--t5)} .tint5 .icon svg{stroke:var(--t5i)}
  .title{font-family:"Quicksand",sans-serif;font-weight:700;font-size:17.5px;line-height:1.25}
  .title .sub{display:block;font-family:"Poppins",sans-serif;font-size:12px;font-weight:300;
    color:var(--ink-faint);line-height:1.35;margin-top:1px}
  .now-tag{display:inline-block;margin-right:7px;font-family:"Poppins",sans-serif;font-size:9.5px;
    font-weight:600;letter-spacing:.09em;text-transform:uppercase;background:var(--badge);
    color:#fff;border-radius:99px;padding:3px 8px;vertical-align:2px}
  .note{grid-column:3/-1;font-size:12.5px;color:var(--ink-soft);font-weight:300;margin:-2px 0 0}
  .check{width:40px;height:40px;border-radius:50%;border:2.5px solid var(--line);
    background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;
    transition:transform .15s ease}
  .check:active{transform:scale(.9)}
  .check svg{width:21px;height:21px;stroke:var(--ink-faint);fill:none;stroke-width:2.8;
    stroke-linecap:round;stroke-linejoin:round;opacity:0}
  .step.is-done .check{background:var(--brand);border-color:var(--brand)}
  .step.is-done .check svg{stroke:#fff;opacity:1}
  .circleslot{list-style:none;margin:0}
  .circleslot .circle{margin-top:0}

  /* ---- edit mode ---- */
  .step.editing{grid-template-columns:1fr;gap:9px;border-color:var(--line)}
  .erow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .erow label{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
  .ecirc{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:400;
    color:var(--ink-soft);text-transform:none;letter-spacing:0}
  .ecirc input{width:17px;height:17px;accent-color:var(--brand);margin:0}
  input[type="time"],input[type="text"],input[type="date"],select,textarea{
    font-family:"Poppins",sans-serif;font-size:14px;color:var(--ink);background:var(--ground);
    border:1.5px solid var(--line);border-radius:var(--r-sm);padding:9px 11px}
  .f-text{flex:1 1 180px;min-width:0}
  textarea{width:100%;resize:vertical;min-height:54px;font-size:13px;font-weight:300}
  .del{color:var(--badge);border-color:var(--badge)}
  .del:hover{color:var(--badge);border-color:var(--badge)}
  .addbar{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}
  .editing-what{font-size:12.5px;color:var(--ink-soft);font-weight:300;margin:0 0 9px}

  /* ---- circle time ---- */
  .circle{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);
    padding:20px 22px;margin-top:24px;border:2px solid var(--brand-soft)}
  .circle h2{font-size:23px;color:var(--brand-ink)}
  .circle-head{margin-bottom:14px}
  .vids{list-style:none;margin:0;padding:0;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
  .vid{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:var(--surface-2);border:1.5px solid transparent;border-radius:var(--r-sm);
    padding:11px 12px;color:inherit;font-family:"Quicksand",sans-serif;font-size:14.5px;
    font-weight:700;text-decoration:none}
  .vid:hover{border-color:var(--brand);background:var(--brand-soft)}
  .vid .play{width:32px;height:32px;flex:none;border-radius:50%;background:var(--brand);
    display:grid;place-items:center}
  .vid .play svg{width:13px;height:13px;fill:#fff;stroke:none}
  .vid .vname{min-width:0;line-height:1.25}
  .vid .vlen{display:block;font-family:"Poppins",sans-serif;font-weight:300;font-size:11.5px;
    color:var(--ink-soft);margin-top:1px}
  .lang{display:inline-block;font-family:"Poppins",sans-serif;font-size:9px;font-weight:600;
    letter-spacing:.08em;border-radius:99px;padding:2px 6px;margin-left:6px;vertical-align:1.5px}
  .lang.en{background:var(--t2);color:var(--t2i)}
  .lang.tl{background:var(--t1);color:var(--t1i)}

  /* ---- setup code ---- */
  .save{margin-top:24px;background:var(--warn-soft);border:1.5px solid var(--warn-line);
    border-radius:var(--r-lg);padding:20px 22px}
  .save h2{font-size:20px;color:var(--warn);display:flex;align-items:center;gap:9px}
  .save h2 svg{width:22px;height:22px;fill:none;stroke:var(--warn);stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;flex:none}
  .save p{font-size:13.5px;color:var(--ink);font-weight:300;margin:10px 0 0}
  .save ol{margin:10px 0 0;padding-left:20px;font-size:13.5px;color:var(--ink);font-weight:300}
  .save li{margin-bottom:5px}
  .save li strong{font-weight:600}
  .save textarea{margin-top:12px;background:var(--surface)}
  .foot{margin-top:26px;padding-top:16px;border-top:1.5px solid var(--line);
    font-size:12.5px;color:var(--ink-faint);font-weight:300;display:flex;flex-direction:column;gap:5px}

  @media (max-width:520px){
    .step{grid-template-columns:50px 36px 1fr auto;gap:10px;padding:12px}
    .step.no-check{grid-template-columns:50px 36px 1fr}
    .icon{width:36px;height:36px;border-radius:11px}.icon svg{width:20px;height:20px}
    .title{font-size:16px}.time{font-size:12px}.check{width:36px;height:36px}
    .note{grid-column:1/-1}.vids{grid-template-columns:1fr}
    .today,.circle,.save{padding-inline:17px}
    .daystrip button{font-size:10.5px}
    .daystrip button .dnum{font-size:12px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <div class="langrow">
    <div class="langsw" id="langsw" role="group" aria-label="Language / Wika">
      <button type="button" data-lang="en"  aria-pressed="true">English</button>
      <button type="button" data-lang="fil" aria-pressed="false">Filipino</button>
    </div>
  </div>

  <div class="banner" id="noStore" hidden></div>

  <section class="namecard" id="nameCard" hidden>
    <h2 id="nameTitle"></h2>
    <p id="nameHelp"></p>
    <div class="namerow">
      <input type="text" id="childInput" maxlength="28" autocomplete="off">
      <button class="namebtn" id="saveName" type="button"></button>
    </div>
  </section>

  <header class="today">
    <div class="today-top">
      <div class="today-text">
        <p class="eyebrow" id="kidLine">&nbsp;</p>
        <h1 id="dayName">&nbsp;</h1>
        <p class="alt" id="dayAlt">&nbsp;</p>
        <p id="fullDate">&nbsp;</p>
      </div>
      <div id="clock">&nbsp;</div>
    </div>
    <div class="weekrow">
      <button class="navbtn" id="prevWeek" type="button" aria-label="Previous week">&#8249;</button>
      <ul class="daystrip" id="daystrip"></ul>
      <button class="navbtn" id="nextWeek" type="button" aria-label="Next week">&#8250;</button>
    </div>
    <div class="progress-row" id="progressRow">
      <div class="bar"><span id="progressBar"></span></div>
      <div id="progressText">&nbsp;</div>
    </div>
  </header>

  <section class="planner" id="planner" hidden>
    <div class="planhead">
      <span class="chip" id="planChip"></span>
      <button class="btn btn-sm" id="backToday" type="button" hidden></button>
    </div>
    <div class="planrow">
      <button class="btn btn-sm btn-plum" id="makePlan" type="button"></button>
      <button class="btn btn-sm del" id="removePlan" type="button" hidden></button>
    </div>
    <div class="planrow">
      <label class="eyebrow" for="dateJump" id="dateJumpLabel"></label>
      <input type="date" id="dateJump">
    </div>
    <p class="planhint" id="planHint"></p>
    <div>
      <p class="eyebrow" id="plannedLabel"></p>
      <ul class="planned" id="plannedList"></ul>
      <p class="planempty" id="plannedEmpty" hidden></p>
    </div>
  </section>

  <div class="controls">
    <button class="btn" id="editToggle" type="button" aria-pressed="false"></button>
    <button class="btn" id="notesToggle" type="button" aria-pressed="false"></button>
    <button class="btn" id="jumpNow" type="button"></button>
    <button class="btn" id="planAhead" type="button" aria-pressed="false"></button>
    <button class="btn" id="resetChecks" type="button"></button>
  </div>

  <p class="editing-what" id="editingWhat" hidden></p>
  <ul class="steps" id="steps"></ul>
  <div class="addbar" id="addbar" hidden>
    <button class="btn btn-sm" id="addStep" type="button"></button>
    <button class="btn btn-sm del" id="resetAll" type="button"></button>
  </div>

  <div id="circleHome">
    <section class="circle" id="circleSection">
      <div class="circle-head">

  function pad(n){ return n<10 ? "0"+n : ""+n }

  function mins(hhmm){var p=String(hhmm).split(":");return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0)}

  function longDate(d){
    return DAYS[state.lang][d.getDay()]+", "+MONTHS[state.lang][d.getMonth()]+" "+d.getDate();

  function normalise(list){
    for(var i=0;i<list.length;i++){
      var s = list[i];
      if(s.fil === undefined && s.tl !== undefined) s.fil = s.tl;
      if(s.nFil === undefined && s.note !== undefined) s.nFil = s.note;
      if(s.en === undefined) s.en = "";
      if(s.fil === undefined) s.fil = "";
    }
    return list;
  }
  function clone(list){
    var out = [];
    for(var i=0;i<list.length;i++){

      for(var k in s){ if(Object.prototype.hasOwnProperty.call(s,k)) c[k] = s[k]; }

    }
    return out;
  }

          if(p && (p.lang==="en"||p.lang==="fil")) state.lang = p.lang;

            for(var k in p.plans){
              if(Object.prototype.hasOwnProperty.call(p.plans,k) &&
                 Object.prototype.toString.call(p.plans[k])==="[object Array]"){

            }
          }
          if(p && p.done && typeof p.done==="object" && !(p.done instanceof Array)){
            for(var d in p.done){
              if(Object.prototype.hasOwnProperty.call(p.done,d) &&
                 Object.prototype.toString.call(p.done[d])==="[object Array]"){
                state.done[d] = p.done[d];
              }
            }
          }
        }
      }catch(e){}
    }
    prune();
  }
  function save(){
    try{ window.localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
    refreshCode();
  }
  function sortActive(){ activeRoutine().sort(function(a,b){return mins(a.t)-mins(b.t)}); }

  /* ---------- setup code ---------- */
  var codeBox = document.getElementById("codeBox");
  function refreshCode(){
    try{
      var payload = JSON.stringify({lang:state.lang, child:state.child,
                                    routine:state.routine, plans:state.plans});
      codeBox.value = window.btoa(unescape(encodeURIComponent(payload)));
    }catch(e){ codeBox.value = "—"; }
  }
  document.getElementById("copyCode").addEventListener("click", function(){
    var b = this;
    codeBox.focus(); codeBox.select();
    var ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){}
    if(!ok && navigator.clipboard){ navigator.clipboard.writeText(codeBox.value); ok = true; }
    b.textContent = ok ? L().copied : L().selectCopy;
    setTimeout(function(){ b.textContent = L().copy; }, 2400);
  });
  document.getElementById("pasteCode").addEventListener("click", function(){
    var raw = window.prompt(L().pastePrompt);
    if(!raw) return;
    try{
      var p = JSON.parse(decodeURIComponent(escape(window.atob(raw.replace(/\s+/g,"")))));
      if(!p || Object.prototype.toString.call(p.routine)!=="[object Array]" || !p.routine.length) throw 0;
      state.routine = normalise(p.routine);
      state.child   = typeof p.child==="string" ? p.child : "";
      if(p.lang==="en"||p.lang==="fil") state.lang = p.lang;
      state.plans = {};
      if(p.plans && typeof p.plans==="object"){
        for(var k in p.plans){
          if(Object.prototype.hasOwnProperty.call(p.plans,k) &&
             Object.prototype.toString.call(p.plans[k])==="[object Array]"){
            state.plans[k] = normalise(p.plans[k]);
          }
        }
      }
      state.done = {}; prune();
      viewIso = todayIso(); weekAnchor = new Date();
      save(); applyLang();
    }catch(e){ window.alert(L().pasteBad); }
  });

  /* ---------- render ---------- */
  var stepsEl  = document.getElementById("steps");
  var circleEl = document.getElementById("circleSection");
  var circleHome = document.getElementById("circleHome");
  var editing = false, showNotes = false, plannerOpen = false;

  function iconSelect(cur){
    var names = ICON_NAMES[state.lang] || ICON_NAMES.en;
    var out = '<select class="f-icon" aria-label="Icon">';
    for(var k in ICONS){ if(Object.prototype.hasOwnProperty.call(ICONS,k)){
      out += '<option value="'+k+'"'+(k===cur?' selected':'')+'>'+esc(names[k]||k)+'</option>';
    }}
    return out+'</select>';
  }

  /* put the songs right under whichever activity is flagged, else back at the bottom */
  function placeCircle(){
    var host = null, rows = stepsEl.children, list = activeRoutine();
    var flagged = null;
    for(var i=0;i<list.length;i++){ if(list[i].circle){ flagged = list[i].id; break; } }
    if(flagged && !editing){
      for(var j=0;j<rows.length;j++){
        if(rows[j].getAttribute("data-id") === flagged){ host = rows[j]; break; }
      }
    }
    var slot = document.getElementById("circleSlot");
    if(host){
      if(!slot){
        slot = document.createElement("li");
        slot.id = "circleSlot"; slot.className = "circleslot";
      }
      if(host.nextSibling !== slot) stepsEl.insertBefore(slot, host.nextSibling);
      if(circleEl.parentNode !== slot) slot.appendChild(circleEl);
    }else{
      if(circleEl.parentNode !== circleHome) circleHome.appendChild(circleEl);
      if(slot && slot.parentNode) slot.parentNode.removeChild(slot);
    }
  }

  function render(){
    var t = L(), list = activeRoutine(), done = doneList(), canCheck = isToday();
    stepsEl.innerHTML = "";
    for(var i=0;i<list.length;i++){
      var s = list[i];
      var li = document.createElement("li");
      li.setAttribute("data-id", s.id);
      if(editing){
        var priV = state.lang==="en" ? (s.en||"") : (s.fil||"");
        var secV = state.lang==="en" ? (s.fil||"") : (s.en||"");
        var nPri = state.lang==="en" ? (s.nEn||"") : (s.nFil||"");
        li.className = "step editing";
        li.innerHTML =
          '<div class="erow">'+
            '<label>'+esc(t.lblTime)+'</label><input type="time" class="f-time" value="'+esc(s.t)+'">'+
            iconSelect(s.icon)+
            '<button class="btn btn-sm del f-del" type="button">'+esc(t.remove)+'</button>'+
          '</div>'+
          '<div class="erow">'+
            '<input type="text" class="f-pri f-text" value="'+esc(priV)+'" placeholder="'+esc(t.phTitle)+'">'+
            '<input type="text" class="f-sec f-text" value="'+esc(secV)+'" placeholder="'+esc(t.phAlt)+'">'+
          '</div>'+
          '<textarea class="f-note" placeholder="'+esc(t.phNote)+'">'+esc(nPri)+'</textarea>'+
          '<label class="ecirc"><input type="checkbox" class="f-circle"'+(s.circle?' checked':'')+'>'+
            esc(t.circleHere)+'</label>';
      }else{
        var second = sec(s), n = noteOf(s), isDone = done.indexOf(s.id)!==-1;
        li.className = "step tint"+((i%5)+1) + (isDone && canCheck ? " is-done" : "") +
                       (canCheck ? "" : " no-check");
        li.innerHTML =
          '<span class="time">'+pretty(s.t)+'</span>'+
          '<span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[s.icon]||ICONS.sun)+'</svg></span>'+
          '<h2 class="title">'+esc(pri(s))+(second?'<span class="sub">'+esc(second)+'</span>':'')+'</h2>'+
          (canCheck
            ? '<button class="check" type="button" aria-label="'+esc(t.doneCount)+'" aria-pressed="'+
              (isDone?"true":"false")+'">'+
              '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.8 9.6 17.4 19 7"/></svg></button>'
            : '')+
          (n ? '<p class="note"'+(showNotes?"":" hidden")+'>'+esc(n)+'</p>' : '');
      }
      stepsEl.appendChild(li);
    }
    placeCircle();
    paint();
  }

  function renderVideos(){
    var out = "";
    for(var i=0;i<VIDEOS.length;i++){
      var v = VIDEOS[i];
      var desc = state.lang==="en" ? v.dEn : v.dFil;
      var play = '<span class="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5Z"/></svg></span>';
      var chip = v.lang ? '<span class="lang '+(v.lang==="EN"?"en":"tl")+'">'+v.lang+'</span>' : '';
      var label = '<span class="vname">'+esc(v.name)+chip+'<span class="vlen">'+esc(desc)+'</span></span>';
      out += '<li><a class="vid" href="'+D+esc(v.id)+'/view" target="_blank" rel="noopener">'+play+label+'</a></li>';
    }
    document.getElementById("vids").innerHTML = out;
  }

  /* ---------- progress ---------- */
  var barEl = document.getElementById("progressBar");
  var txtEl = document.getElementById("progressText");
  var progRow = document.getElementById("progressRow");
  function paint(){
    var list = activeRoutine(), done = doneList(), n = 0;
    for(var i=0;i<list.length;i++){ if(done.indexOf(list[i].id)!==-1) n++; }
    barEl.style.width = (list.length ? n/list.length*100 : 0) + "%";
    txtEl.textContent = n + " / " + list.length + " " + L().doneCount;
    progRow.hidden = !isToday();
  }

  /* ---------- header, week strip, planner ---------- */
  var dayNameEl=document.getElementById("dayName"), dayAltEl=document.getElementById("dayAlt"),
      fullDateEl=document.getElementById("fullDate"), clockEl=document.getElementById("clock"),
      stripEl=document.getElementById("daystrip"), kidEl=document.getElementById("kidLine"),
      plannerEl=document.getElementById("planner"), nameCard=document.getElementById("nameCard");

  function drawName(){
    var t = L();
    nameCard.hidden = !!state.child;
    document.getElementById("nameTitle").textContent = t.nameTitle;
    document.getElementById("nameHelp").textContent  = t.nameHelp;
    document.getElementById("childInput").placeholder = t.namePlaceholder;
    document.getElementById("saveName").textContent  = t.saveName;
  }

  function drawHeader(){
    var d = fromIso(viewIso), other = state.lang==="en" ? "fil" : "en", t = L();
    dayNameEl.textContent  = DAYS[state.lang][d.getDay()];
    dayAltEl.textContent   = DAYS[other][d.getDay()];
    fullDateEl.textContent = MONTHS[state.lang][d.getMonth()]+" "+d.getDate()+", "+d.getFullYear();
    var label;
    if(isToday()) label = state.child ? t.kidLine(state.child) : t.noName;
    else          label = state.child ? t.viewLine(state.child) : t.viewNoName;
    kidEl.innerHTML = esc(label) +
      (state.child ? '<button class="changename" id="changeName" type="button">'+esc(t.changeName)+'</button>' : '');
  }

  function drawWeek(){
    var start = addDays(weekAnchor, -weekAnchor.getDay());
    var tIso = todayIso(), html = "";
    for(var i=0;i<7;i++){
      var d = addDays(start, i), di = iso(d), cls = [];
      if(di === tIso) cls.push("is-today");
      if(di === viewIso) cls.push("is-view");
      if(hasPlan(di)) cls.push("has-plan");
      html += '<li class="'+cls.join(" ")+'">'+
                '<button type="button" data-date="'+di+'"'+(isPast(di)?' disabled':'')+'>'+
                  SHORT[state.lang][d.getDay()]+'<span class="dnum">'+d.getDate()+'</span>'+
                '</button></li>';
    }
    stripEl.innerHTML = html;
    var thisWeekStart = addDays(new Date(), -(new Date()).getDay());
    document.getElementById("prevWeek").disabled = iso(start) <= iso(thisWeekStart);
  }

  function drawPlanner(){
    var t = L();
    plannerEl.hidden = !plannerOpen;
    document.getElementById("planAhead").setAttribute("aria-pressed", plannerOpen?"true":"false");
    if(!plannerOpen) return;

    var chip = document.getElementById("planChip"), special = hasPlan(viewIso);
    chip.className = "chip " + (special ? "special" : "everyday");
    chip.textContent = special ? t.chipSpecial : t.chipEveryday;

    document.getElementById("makePlan").hidden = special;
    document.getElementById("makePlan").textContent = t.makePlan;
    document.getElementById("removePlan").hidden = !special;
    document.getElementById("removePlan").textContent = t.removePlan;

    var back = document.getElementById("backToday");
    back.hidden = isToday(); back.textContent = t.backToday;

    document.getElementById("dateJumpLabel").textContent = t.dateJump;
    var dj = document.getElementById("dateJump");
    dj.min = todayIso(); dj.value = viewIso;
    document.getElementById("planHint").textContent = t.planHint;
    document.getElementById("plannedLabel").textContent = t.plannedLabel;

    var keys = [], k;
    for(k in state.plans){
      if(Object.prototype.hasOwnProperty.call(state.plans,k) && !isPast(k)) keys.push(k);
    }
    keys.sort();
    var out = "";
    for(var i=0;i<keys.length;i++){
      out += '<li><button type="button" data-date="'+keys[i]+'">'+
             esc(longDate(fromIso(keys[i])))+'</button></li>';
    }
    document.getElementById("plannedList").innerHTML = out;
    var empty = document.getElementById("plannedEmpty");
    empty.hidden = keys.length > 0; empty.textContent = t.plannedEmpty;
  }

  function drawEditingWhat(){
    var el = document.getElementById("editingWhat");
    if(!editing){ el.hidden = true; return; }
    el.hidden = false;
    el.textContent = hasPlan(viewIso)
      ? L().editingPlan(longDate(fromIso(viewIso)))
      : L().editingEveryday;
  }

  function goToDate(d){
    if(isPast(d)) return;
    if(editing){ harvest(); save(); }
    viewIso = d; weekAnchor = fromIso(d);
    drawHeader(); drawWeek(); drawPlanner(); render(); drawEditingWhat(); tick(true);
  }

  /* ---------- clock + now highlight ---------- */
  var lastTick = "";
  function tick(force){
    var now = new Date(), key = todayIso()+"|"+state.lang+"|"+viewIso;
    if(force || key !== lastTick){ lastTick = key; drawHeader(); drawWeek(); }
    var h=now.getHours(), mm=now.getMinutes(), ap=h<12?"AM":"PM", h12=h%12; if(h12===0)h12=12;
    clockEl.textContent = h12+":"+(mm<10?"0"+mm:mm)+" "+ap;

    if(editing || !isToday()){
      var old = stepsEl.querySelectorAll(".is-now");
      for(var q=0;q<old.length;q++){
        old[q].classList.remove("is-now");
        var ot = old[q].querySelector(".now-tag"); if(ot) ot.remove();
      }
      return;
    }
    var list = activeRoutine(), nowMins = h*60+mm, cur = -1;
    for(var k=0;k<list.length;k++){ if(mins(list[k].t) <= nowMins) cur = k; }
    var rows = stepsEl.querySelectorAll(".step");
    for(var j=0;j<rows.length;j++){
      var on = (j === cur);
      if(rows[j].classList.contains("is-now") !== on){
        rows[j].classList.toggle("is-now", on);
        var ti = rows[j].querySelector(".title"), tag = ti ? ti.querySelector(".now-tag") : null;
        if(on && ti && !tag) ti.insertAdjacentHTML("afterbegin", '<span class="now-tag">'+esc(L().nowTag)+'</span>');
        else if(!on && tag) tag.remove();
      }
    }
  }

  /* ---------- language ---------- */
  function applyLang(){
    var t = L();
    document.documentElement.lang = state.lang === "en" ? "en" : "fil";
    var sw = document.getElementById("langsw").children;
    for(var i=0;i<sw.length;i++){
      sw[i].setAttribute("aria-pressed", sw[i].getAttribute("data-lang")===state.lang ? "true":"false");
    }
    document.getElementById("editToggle").textContent  = editing ? t.editDone : t.edit;
    document.getElementById("notesToggle").textContent = t.notes;
    document.getElementById("jumpNow").textContent     = t.now;
    document.getElementById("planAhead").textContent   = t.planAhead;
    document.getElementById("resetChecks").textContent = t.clear;
    document.getElementById("addStep").textContent     = t.add;
    document.getElementById("resetAll").textContent    = t.reset;
    document.getElementById("circleSub").textContent   = t.circleSub;
    document.getElementById("saveTitleText").textContent = t.saveTitle;
    document.getElementById("saveWarn").textContent    = t.saveWarn;
    document.getElementById("saveSteps").innerHTML =
      "<li>"+t.saveStep1+"</li><li>"+t.saveStep2+"</li><li>"+t.saveStep3+"</li>";
    document.getElementById("copyCode").textContent    = t.copy;
    document.getElementById("pasteCode").textContent   = t.paste;
    document.getElementById("foot1").textContent       = t.foot1;
    document.getElementById("foot2").textContent       = t.foot2;
    var ns = document.getElementById("noStore");
    ns.innerHTML = t.noStore; ns.hidden = storeOK;

    drawName(); renderVideos(); drawHeader(); drawWeek(); drawPlanner();
    render(); drawEditingWhat(); tick(true);
  }

  document.getElementById("langsw").addEventListener("click", function(ev){
    var b = ev.target.closest ? ev.target.closest("button[data-lang]") : null;
    if(!b) return;
    var next = b.getAttribute("data-lang");
    if(next === state.lang) return;
    if(editing) harvest();
    state.lang = next; save(); applyLang();
  });

  /* ---------- child's name ---------- */
  function commitName(){
    var v = document.getElementById("childInput").value.trim().slice(0,28);
    if(!v) return;
    state.child = v; save(); drawName(); drawHeader();
  }
  document.getElementById("saveName").addEventListener("click", commitName);
  document.getElementById("childInput").addEventListener("keydown", function(ev){
    if(ev.key === "Enter"){ ev.preventDefault(); commitName(); }
  });
  kidEl.addEventListener("click", function(ev){
    if(!ev.target.closest || !ev.target.closest("#changeName")) return;
    nameCard.hidden = false;
    var inp = document.getElementById("childInput");
    inp.value = state.child; inp.focus(); inp.select();
  });

  /* ---------- week strip + planner actions ---------- */
  stripEl.addEventListener("click", function(ev){
    var b = ev.target.closest ? ev.target.closest("button[data-date]") : null;
    if(!b || b.disabled) return;
    var d = b.getAttribute("data-date");
    if(d !== todayIso() && !plannerOpen) plannerOpen = true;
    goToDate(d);
  });
  document.getElementById("prevWeek").addEventListener("click", function(){
    if(this.disabled) return;
    weekAnchor = addDays(weekAnchor, -7); drawWeek();
  });
  document.getElementById("nextWeek").addEventListener("click", function(){
    weekAnchor = addDays(weekAnchor, 7); drawWeek();
  });
  document.getElementById("planAhead").addEventListener("click", function(){
    plannerOpen = !plannerOpen; drawPlanner();
  });
  document.getElementById("backToday").addEventListener("click", function(){ goToDate(todayIso()); });
  document.getElementById("dateJump").addEventListener("change", function(){
    if(this.value && !isPast(this.value)) goToDate(this.value);
    else this.value = viewIso;
  });
  document.getElementById("makePlan").addEventListener("click", function(){
    if(editing) harvest();
    state.plans[viewIso] = clone(state.routine);
    save(); drawWeek(); drawPlanner(); render(); drawEditingWhat();
  });
  document.getElementById("removePlan").addEventListener("click", function(){
    if(!window.confirm(L().removeAsk)) return;
    delete state.plans[viewIso];
    save(); drawWeek(); drawPlanner(); render(); drawEditingWhat(); tick(true);
  });
  document.getElementById("plannedList").addEventListener("click", function(ev){
    var b = ev.target.closest ? ev.target.closest("button[data-date]") : null;
    if(b) goToDate(b.getAttribute("data-date"));
  });

  /* ---------- steps ---------- */
  stepsEl.addEventListener("click", function(ev){
    var t = ev.target;
    var chk = t.closest ? t.closest(".check") : null;
    if(chk){
      var id = chk.parentNode.getAttribute("data-id");
      var done = doneList(), at = done.indexOf(id);
      if(at === -1) done.push(id); else done.splice(at,1);
      chk.parentNode.classList.toggle("is-done", at === -1);
      chk.setAttribute("aria-pressed", at === -1 ? "true" : "false");
      save(); paint(); return;
    }
    var del = t.closest ? t.closest(".f-del") : null;
    if(del){
      var row = del.closest("li"), rid = row.getAttribute("data-id");
      harvest();
      var list = activeRoutine();
      for(var i=0;i<list.length;i++){ if(list[i].id === rid){ list.splice(i,1); break; } }
      save(); render();
    }
  });
  /* only one activity can host the songs */
  stepsEl.addEventListener("change", function(ev){
    if(!ev.target.classList || !ev.target.classList.contains("f-circle")) return;
    if(!ev.target.checked) return;
    var boxes = stepsEl.querySelectorAll(".f-circle");
    for(var i=0;i<boxes.length;i++){ if(boxes[i] !== ev.target) boxes[i].checked = false; }
  });

  function harvest(){
    var rows = stepsEl.children, list = activeRoutine();
    for(var i=0;i<rows.length;i++){
      var id = rows[i].getAttribute("data-id");
      var tI = rows[i].querySelector ? rows[i].querySelector(".f-time") : null;
      if(!tI) continue;
      for(var j=0;j<list.length;j++){
        if(list[j].id !== id) continue;
        var s = list[j];
        s.t    = tI.value || s.t;
        s.icon = rows[i].querySelector(".f-icon").value;
        var priV = rows[i].querySelector(".f-pri").value;
        var secV = rows[i].querySelector(".f-sec").value;
        var nV   = rows[i].querySelector(".f-note").value;
        var cB   = rows[i].querySelector(".f-circle");
        if(state.lang === "en"){ s.en = priV || L().newAct; s.fil = secV; s.nEn = nV; }
        else                   { s.fil = priV || L().newAct; s.en  = secV; s.nFil = nV; }
        if(cB){ if(cB.checked) s.circle = true; else delete s.circle; }
        break;
      }
    }
    sortActive();
  }

  var editBtn = document.getElementById("editToggle");
  editBtn.addEventListener("click", function(){
    if(editing){ harvest(); save(); }
    editing = !editing;
    editBtn.setAttribute("aria-pressed", editing ? "true" : "false");
    editBtn.textContent = editing ? L().editDone : L().edit;
    document.getElementById("addbar").hidden = !editing;
    render(); drawEditingWhat(); tick(true);
  });

  var notesBtn = document.getElementById("notesToggle");
  notesBtn.addEventListener("click", function(){
    showNotes = !showNotes;
    notesBtn.setAttribute("aria-pressed", showNotes ? "true" : "false");
    var notes = stepsEl.querySelectorAll(".note");
    for(var i=0;i<notes.length;i++) notes[i].hidden = !showNotes;
  });

  document.getElementById("jumpNow").addEventListener("click", function(){
    if(!isToday()) goToDate(todayIso());
    var el = stepsEl.querySelector(".is-now") || stepsEl.firstChild;
    if(el && el.scrollIntoView) el.scrollIntoView({behavior:"smooth", block:"center"});
  });

  document.getElementById("resetChecks").addEventListener("click", function(){
    state.done[viewIso] = []; save(); render();
  });

  document.getElementById("addStep").addEventListener("click", function(){
    harvest();
    activeRoutine().push({id:uid(), t:"12:00", icon:"heart",
      en:UI.en.newAct, fil:UI.fil.newAct, nEn:"", nFil:""});
    sortActive(); save(); render();
  });

  document.getElementById("resetAll").addEventListener("click", function(){
    if(!window.confirm(L().resetAsk)) return;
    if(hasPlan(viewIso)) state.plans[viewIso] = defaultRoutine();
    else state.routine = defaultRoutine();
    state.done[viewIso] = [];
    save(); render(); tick(true);
  });

  /* ---------- go ---------- */
  load();
  state.routine.sort(function(a,b){return mins(a.t)-mins(b.t)});
  applyLang();
  refreshCode();
  setInterval(function(){ tick(); }, 20000);
})();
</script>

</body>
</html>
